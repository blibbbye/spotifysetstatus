name: Build Spotify Status Connector

permissions:
  contents: write

on:
  push:
    paths:
      - "connector/**"
      - ".github/workflows/build-connector.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build connector
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $gccArgs = @(
            "-std=c++17",
            "-Os",
            "-DNDEBUG",
            "-mwindows",
            "-municode",
            "-ffunction-sections",
            "-fdata-sections",
            "connector/SpotifyStatusConnector.cpp",
            "-o",
            "build/Spotify Status Connector.exe",
            "-lwinhttp",
            "-lgdiplus",
            "-lws2_32",
            "-ldwmapi",
            "-lole32",
            "-lshell32",
            "-Wl,--gc-sections",
            "-static-libgcc",
            "-static-libstdc++",
            "-static",
            "-s"
          )
          & g++ @gccArgs
          if ($LASTEXITCODE -ne 0) {
            throw "g++ failed with exit code $LASTEXITCODE"
          }

      - name: Publish connector EXE to repository
        shell: pwsh
        run: |
          Copy-Item "build/Spotify Status Connector.exe" "Spotify Status Connector.exe" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Spotify Status Connector.exe"
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish Spotify Status Connector"
            git push
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spotify-Status-Connector
          path: build/Spotify Status Connector.exe
          if-no-files-found: error
